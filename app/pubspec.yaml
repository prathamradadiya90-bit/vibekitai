name: vibekit_ai
description: "VibeKit AI - Create your next reply, caption and shareable card."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  http: ^1.3.0
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/
